name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, cold start
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # The runner has no `.dev.vars` and no secrets, which is the whole point:
      # this is the environment a fresh deploy starts in. See the script.
      - name: Cold start
        run: bash scripts/smoke-test.sh

  # Seeds the deployed D1 and KV so that what Workers Builds deploys has its
  # content already in place. Gated on `verify`: nothing reaches production
  # until the build and the cold start have passed.
  #
  # `main` only, and never on a pull request. There is one D1 and one KV — no
  # per-environment resources — so a run from any other branch would overwrite
  # live content with a work in progress.
  seed:
    name: Seed and verify the remote stores
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Points at a GitHub Environment, so protection rules (required reviewers,
    # a wait timer) can be added later without touching this file.
    environment: production

    # Both are read by wrangler directly. The token needs two account-scoped
    # permissions and no more: D1:Edit and Workers KV Storage:Edit.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The committed seed.sql and payloads are uploaded as they are; the
      # generators are not re-run here, because regenerating needs the Markdown
      # and D1 in step and would make a push able to publish content that was
      # never reviewed as a diff. Both steps upsert, so re-running is a no-op.
      - name: Seed D1
        run: pnpm exec wrangler d1 execute poschuler --file ./seed/d1/seed.sql --remote --yes

      - name: Seed KV
        run: pnpm run kv:upload:remote

      # Reads back what is actually in the stores. The seed steps report what
      # they sent; only this says what is there.
      - name: Verify the remote stores
        run: pnpm run verify:stores:remote
