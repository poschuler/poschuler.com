name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless — except on
# `main`, where a run is a publication. There, cancelling could land between the
# seed and the deploy and leave the stores ahead of the code, which is the exact
# split this workflow exists to prevent. Runs on `main` therefore queue instead.
#
# A superseded run that is still *pending* is dropped, and that is fine: it has
# executed nothing, and `main` is linear, so the run that replaced it carries
# its commits too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, build, cold start
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Before the build, because it is the cheaper of the two and fails on the
      # things a build cannot see. The integration project seeds its own D1 and
      # KV from the committed fixtures into `.wrangler/state-test`, `--local`,
      # so this needs no credentials and touches nothing deployed.
      - run: pnpm test

      # The stores are seeded from the committed fixtures and never regenerated,
      # so a Markdown edit without a regeneration would republish the previous
      # version in silence. This runs the generators and fails if their output
      # differs from what is in git. No credentials: it reads the local D1,
      # which is why it belongs here and not in `publish`. See the script.
      - name: The committed fixtures match the Markdown
        run: pnpm run check:fixtures

      - run: pnpm build

      # The runner has no `.dev.vars` and no secrets, which is the whole point:
      # this is the environment a fresh deploy starts in. See the script.
      - name: Cold start
        run: bash scripts/smoke-test.sh

  # One job owns the whole publication: schema, stores, deploy. Splitting it
  # would put the order in `needs:` rather than in a list of steps, and would
  # break the deploy outright — `wrangler deploy` finds the built Worker through
  # `.wrangler/deploy/config.json`, a gitignored build artefact. On a fresh
  # runner without it, wrangler falls back to the root `wrangler.jsonc`, whose
  # `main` is the unbuilt entry point and which declares no assets: a green run
  # shipping the wrong Worker with no static files.
  #
  # `main` only, and never on a pull request. There is one D1 and one KV — no
  # per-environment resources — so a run from any other branch would overwrite
  # live content with a work in progress.
  publish:
    name: Seed the stores and deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Generous on purpose. This job installs, seeds, verifies, builds and
    # deploys, and a timeout firing part-way through is indistinguishable from
    # the cancellation the concurrency rule above is written to avoid.
    timeout-minutes: 20

    # Points at a GitHub Environment, so protection rules (required reviewers,
    # a wait timer) can be added later without touching this file.
    environment: production

    # Both are read by wrangler directly. The token needs three account-scoped
    # permissions and no more: D1:Edit, Workers KV Storage:Edit, and Workers
    # Scripts:Edit for the deploy.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, before anything is written. The schema is applied by hand — there
      # is no migration tool, see ADR 0002 — so a commit that changes the
      # table's shape can arrive with the deployed table still on the old one.
      # Seeding into that, or deploying code that reads it, is a broken page
      # rather than a degraded one.
      - name: The deployed schema matches the repository
        run: pnpm run verify:schema:remote

      # The committed seed.sql and payloads are uploaded as they are; `verify`
      # has already established that they are what the generators produce. Both
      # steps upsert and neither empties anything first, so re-running is a
      # no-op and there is no moment where a published Post is missing.
      - name: Seed D1
        run: pnpm exec wrangler d1 execute poschuler --file ./seed/d1/seed.sql --remote --yes

      - name: Seed KV
        run: pnpm run kv:upload:remote

      # Reads back what is actually in the stores. The seed steps report what
      # they sent; only this says what is there. Before the deploy, so the code
      # never goes live over content that failed to land.
      - name: Verify the remote stores
        run: pnpm run verify:stores:remote

      # Builds and ships in one step, in this workspace, for the reason in the
      # job comment above.
      #
      # `set -o pipefail` is not the default for a `run:` block — GitHub uses
      # `bash -e {0}` — so without it the `tee` would swallow a failed deploy and
      # report the step green.
      - name: Build and deploy
        run: |
          set -euo pipefail
          pnpm run deploy | tee deploy.log

      # Exiting 0 means the upload was accepted, not that it became the version
      # serving traffic. This reads that back. See the script for what it
      # deliberately does not prove, and why asking the site itself does not
      # work from here.
      - name: The uploaded version is the one serving
        run: |
          set -euo pipefail

          version="$(grep -oE 'Current Version ID: [0-9a-f-]{36}' deploy.log | tail -1 | awk '{print $NF}')"

          if [[ -z "${version}" ]]; then
            echo "error: 'wrangler deploy' reported no version id." >&2
            exit 1
          fi

          bash scripts/verify-deployment.sh "${version}"
