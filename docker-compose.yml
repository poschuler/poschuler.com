name: poschuler-dot-com

services:
  structurizr:
    # Pinned, and to the same release the exporter and CI use. This is the
    # loosest link if it is left on `latest`: Lite is what rewrites
    # `workspace.json` after every parse, and that file is the *input* to both
    # the export and the committed layout — so an unpinned Lite sits upstream of
    # a pinned renderer. Today `latest` and this tag are the same digest, which
    # is the moment to pin it rather than the moment after they diverge.
    #
    # Not the `-playwright` tag, which serves Lite just as well: the extra 3 GB
    # there is a browser, only rendering needs one, and pulling it to open a
    # page would also couple `pnpm run diagrams` to a running container it does
    # not otherwise need.
    image: structurizr/structurizr:2026.06.28
    command: local
    # The image runs as the distroless "nonroot" user (UID 65532), which cannot
    # write to a host directory owned by us. Run it as the host user instead, so
    # Structurizr can auto-save workspace.json and the files it writes stay ours.
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./architecture:/usr/local/structurizr
      
